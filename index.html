<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Surprise</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff8a00, #e52e71);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: "Poppins", sans-serif;
      color: white;
      overflow: hidden;
      transition: background 0.1s ease;
    }

    button {
      background: white;
      color: #e52e71;
      border: none;
      border-radius: 12px;
      padding: 18px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    img {
      display: none;
      max-width: 90%;
      max-height: 70vh;
      margin-top: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <button id="startBtn">Click Me 🐾</button>
  <img id="catGif" src="cat.gif" alt="Cat GIF">
  <audio id="song" src="song.mp3"></audio>

  <script>
    const btn = document.getElementById('startBtn');
    const gif = document.getElementById('catGif');
    const song = document.getElementById('song');

    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      gif.style.display = 'block';
      song.play();

      // 6 секунди след клика → започва "партито"
      setTimeout(() => {
        if (!isiOS && navigator.vibrate) {
          // Android → вибрация (6 секунди)
          navigator.vibrate([200,100,200,100,200,100,200,100,200,100,200]);
          setTimeout(() => navigator.vibrate(0), 6000);
        }

        // iPhone → парти мигане (6 секунди)
        if (isiOS) {
          const flashInterval = setInterval(() => {
            document.body.style.background =
              document.body.style.background === 'white'
                ? 'linear-gradient(135deg, #ff8a00, #e52e71)'
                : 'white';
          }, 100);

          setTimeout(() => {
            clearInterval(flashInterval);
            document.body.style.background = 'linear-gradient(135deg, #ff8a00, #e52e71)';
          }, 6000);
        }
      }, 6000);

      // След 31 секунди → затваря сайта
      setTimeout(() => {
        window.close();
      }, 31000);
    });
  </script>
</body>
</html>
